<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DC Social Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-gold { color: #d97706; }
        .bg-gold { background-color: #d97706; }
        .bg-gold:hover { background-color: #b45309; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm w-full max-w-2xl overflow-hidden p-8 sm:p-12">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">DC SOCIAL ACADEMY</h1>
            <p class="text-gray-500 text-xs font-semibold uppercase tracking-wider mt-1">CREATE YOUR STUDENT ACCOUNT</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <!-- Row 1: Last Name & First Name -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Last Name</label>
                    <input type="text" id="regLastName" required placeholder="Dela Cruz" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">First Name</label>
                    <input type="text" id="regFirstName" required placeholder="Juan" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
            </div>

            <!-- Row 2: Birthday & CP Number -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Birthday</label>
                    <input type="text" id="regBirthday" required placeholder="dd/mm/yyyy" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">CP Number</label>
                    <input type="text" id="regPhone" required placeholder="09123456789" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
            </div>

            <!-- Row 3: Address (Bagong Dagdag) -->
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">Address</label>
                <input type="text" id="regAddress" required placeholder="Enter your full address" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
            </div>

            <!-- Row 4: Email Address -->
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">Email Address</label>
                <input type="email" id="regEmail" required placeholder="juan@gmail.com" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
            </div>

            <!-- Row 5: Username -->
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">Username</label>
                <input type="text" id="regUsername" required placeholder="Choose a username" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
            </div>

            <!-- Row 6: Password & Retype Password -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Password</label>
                    <input type="password" id="regPassword" required placeholder="Create password" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Retype Password</label>
                    <input type="password" id="regRetypePassword" required placeholder="Confirm password" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
            </div>

            <!-- Row 7: Access Code & PIN -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Access Code</label>
                    <input type="text" id="regCode" required placeholder="Enter code" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">PIN</label>
                    <input type="password" id="regPin" required placeholder="Enter PIN" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-amber-500 bg-white">
                </div>
            </div>

            <!-- Register Button -->
            <div class="pt-2">
                <button type="submit" class="w-full bg-gold text-white font-bold py-3 rounded text-xs tracking-wider transition uppercase">
                    REGISTER
                </button>
            </div>
        </form>

        <p id="regStatus" class="mt-4 text-center text-xs font-semibold"></p>

        <div class="text-center mt-6">
            <span class="text-gray-500 text-xs">Already have an account? </span>
            <a href="index.html" class="text-gold font-bold text-xs hover:underline">Login here</a>
        </div>

    </div>

    <!-- Firebase Script para sa Code Verification at Registration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMVxPTMiA1VTPnam91L9onX0G3DvBLoik",
            authDomain: "dc-social-academy-v2.firebaseapp.com",
            projectId: "dc-social-academy-v2",
            storageBucket: "dc-social-academy-v2.firebasestorage.app",
            messagingSenderId: "1000423422174",
            appId: "1:1000423422174:web:b5c45a2e9926be0b196a4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const regForm = document.getElementById('registerForm');
        const regStatus = document.getElementById('regStatus');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const lastName = document.getElementById('regLastName').value;
            const firstName = document.getElementById('regFirstName').value;
            const birthday = document.getElementById('regBirthday').value;
            const phone = document.getElementById('regPhone').value;
            const address = document.getElementById('regAddress').value; // Sinasama na ang address
            const email = document.getElementById('regEmail').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const retypePassword = document.getElementById('regRetypePassword').value;
            const inputCode = document.getElementById('regCode').value.trim();
            const pin = document.getElementById('regPin').value;

            if(password !== retypePassword) {
                regStatus.textContent = "Error: Hindi magkatugma ang Password at Retype Password.";
                regStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
                return;
            }

            regStatus.textContent = "Sine-verify ang Access Code...";
            regStatus.className = "mt-4 text-center text-xs font-semibold text-gray-500";

            try {
                const codesSnapshot = await getDocs(collection(db, "codes"));
                let targetCodeDocId = null;
                let isAlreadyUsed = false;
                let codeExists = false;

                codesSnapshot.forEach((docItem) => {
                    const data = docItem.data();
                    if(data.code === inputCode) {
                        codeExists = true;
                        if(data.isUsed) {
                            isAlreadyUsed = true;
                        } else {
                            targetCodeDocId = docItem.id;
                        }
                    }
                });

                if(!codeExists) {
                    regStatus.textContent = "Error: Ang Access Code na ito ay hindi umiiral o galing sa admin.";
                    regStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
                    return;
                }

                if(isAlreadyUsed) {
                    regStatus.textContent = "Error: Ang Access Code na ito ay nagamit na!";
                    regStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
                    return;
                }

                // I-save ang student account kasama ang address sa "users" collection
                await addDoc(collection(db, "users"), {
                    lastName,
                    firstName,
                    birthday,
                    phone,
                    address,
                    email,
                    username,
                    password,
                    code: inputCode,
                    pin,
                    createdAt: new Date()
                });

                await updateDoc(doc(db, "codes", targetCodeDocId), {
                    isUsed: true
                });

                regStatus.textContent = "Registration successful! Maaari ka nang mag-login.";
                regStatus.className = "mt-4 text-center text-xs font-semibold text-green-600";
                regForm.reset();
            } catch (error) {
                console.error("Error:", error);
                regStatus.textContent = "Error: " + error.message;
                regStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
            }
        });
    </script>
</body>
</html>

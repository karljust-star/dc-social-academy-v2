<!-- Firebase Script para sa Student Login -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMVxPTMiA1VTPnam91L9onX0G3DvBLoik",
            authDomain: "dc-social-academy-v2.firebaseapp.com",
            projectId: "dc-social-academy-v2",
            storageBucket: "dc-social-academy-v2.firebasestorage.app",
            messagingSenderId: "1000423422174",
            appId: "1:1000423422174:web:b5c45a2e9926be0b196a4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const inputUser = document.getElementById('loginUsername').value.trim();
            const inputPass = document.getElementById('loginPassword').value.trim();

            loginStatus.textContent = "Bine-verify ang account...";
            loginStatus.className = "mt-4 text-center text-xs font-semibold text-gray-500";

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let loggedInUserData = null;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.username === inputUser && (data.password === inputPass || data.pin === inputPass)) {
                        loggedInUserData = data;
                    }
                });

                if (loggedInUserData) {
                    // I-save ang firstName at iba pang details sa localStorage para magamit sa dashboard
                    localStorage.setItem('dc_user_firstname', loggedInUserData.firstName || "User");
                    localStorage.setItem('dc_user_email', loggedInUserData.email || "");
                    localStorage.setItem('dc_user_birthday', loggedInUserData.birthday || "");
                    localStorage.setItem('dc_user_address', loggedInUserData.address || "");
                    localStorage.setItem('dc_user_code', loggedInUserData.code || "");

                    loginStatus.textContent = "Login successful! Redirecting...";
                    loginStatus.className = "mt-4 text-center text-xs font-semibold text-green-600";
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    loginStatus.textContent = "Error: Mali ang username o password/PIN mo.";
                    loginStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
                }
            } catch (error) {
                console.error("Error:", error);
                loginStatus.textContent = "Error sa pag-connect sa database.";
                loginStatus.className = "mt-4 text-center text-xs font-semibold text-red-600";
            }
        });
    </script>

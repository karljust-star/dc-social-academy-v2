<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DC Social Academy</title>
    
    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111418;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #1a1f26;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2d3748;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand h2 {
            font-size: 20px;
            color: #e5be01;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .login-brand p {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #111418;
            border: 1px solid #374151;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #e5be01;
            box-shadow: 0 0 0 3px rgba(229, 190, 1, 0.15);
        }

        .btn-login {
            background: #e5be01;
            color: #111418;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #d4ae01;
        }

        #loginStatus {
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <h2>DC SOCIAL ACADEMY</h2>
            <p>Mag-log in para pumasok sa iyong Dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Ilagay ang iyong username" required>
            </div>
            <div class="form-group">
                <label>Password / PIN</label>
                <input type="password" id="loginPassword" placeholder="Ilagay ang iyong password" required>
            </div>

            <button type="submit" class="btn-login">Mag-log In</button>
            <p id="loginStatus"></p>
        </form>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDMVxPTMiA1VTPnam91L9onX0G3DvBLoik",
            authDomain: "dc-social-academy-v2.firebaseapp.com",
            projectId: "dc-social-academy-v2",
            storageBucket: "dc-social-academy-v2.firebasestorage.app",
            messagingSenderId: "1000423422174",
            appId: "1:1000423422174:web:b5c45a2e9926be0b196a4f"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- LOGIN LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const statusMsg = document.getElementById('loginStatus');

            if (!usernameInput || !passwordInput) {
                statusMsg.style.color = "#ef4444";
                statusMsg.textContent = "Mangyaring punan ang lahat ng field.";
                return;
            }

            try {
                statusMsg.style.color = "#9ca3af";
                statusMsg.textContent = "Nag-verify ng account...";

                // Hanapin ang user sa Firestore database gamit ang username
                const querySnapshot = await db.collection("users")
                    .where("username", "==", usernameInput)
                    .get();

                if (querySnapshot.empty) {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.textContent = "Walang nahanap na account na may ganitong username.";
                    return;
                }

                let userDoc = null;
                let userData = null;

                querySnapshot.forEach((doc) => {
                    userDoc = doc;
                    userData = doc.data();
                });

                // Suriin kung tama ang password o pin
                const dbPassword = userData.password || userData.pin;

                if (passwordInput !== dbPassword) {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.textContent = "Mali ang iyong password o PIN!";
                    return;
                }

                // Suriin kung naka-block ang account
                if (userData.status === "Blocked" || userData.isBlocked === true) {
                    statusMsg.style.color = "#ef4444";
                    statusMsg.textContent = "Ang iyong account ay na-block ng Admin.";
                    return;
                }

                // --- SAVE NG DETAILS SA LOCALSTORAGE ---
                localStorage.setItem('dc_user_id', userDoc.id);

                let fullName = userData.fullName || ((userData.firstName || "") + " " + (userData.lastName || "")) || userData.name || "Student User";
                localStorage.setItem('dc_user_fullname', fullName.trim());

                localStorage.setItem('dc_user_phone', userData.cpNumber || userData.phone || userData.mobile || "");
                localStorage.setItem('dc_user_email', userData.email || "");
                localStorage.setItem('dc_user_birthday', userData.birthday || userData.birthdate || userData.bday || "");

                // Dito nasasalo at nai-save ang address patungong localStorage para sa student settings
                const userAddress = userData.address || userData.location || userData.tahanan || "N/A";
                localStorage.setItem('dc_user_address', userAddress);

                statusMsg.style.color = "#10b981";
                statusMsg.textContent = "Tagumpay ang pag-login! Binubuksan ang dashboard...";

                // Redirect papunta sa student dashboard
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                statusMsg.style.color = "#ef4444";
                statusMsg.textContent = "May naganap na error. Subukang muli.";
            }
        });
    </script>
</body>
</html>

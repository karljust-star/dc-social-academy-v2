<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Social Academy</title>
    <!-- Tailwind CSS para sa magandang disenyo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">DC Social Academy</h2>
        
        <!-- Form para sa pag-register o pag-save ng data -->
        <form id="dataForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Pangalan:</label>
                <input type="text" id="nameInput" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                <input type="email" id="emailInput" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                I-save sa Database
            </button>
        </form>
        <p id="statusMsg" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <!-- Firebase SDK Scripts (Modular v11 / Latest using script tags) -->
    <script type="module">
        // Import ang Firebase SDK mula sa gstatic
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Ang iyong bagong Firebase configuration keys
        const firebaseConfig = {
            apiKey: "AIzaSyDMVxPTMiA1VTPnam91L9onX0G3DvBLoik",
            authDomain: "dc-social-academy-v2.firebaseapp.com",
            projectId: "dc-social-academy-v2",
            storageBucket: "dc-social-academy-v2.firebasestorage.app",
            messagingSenderId: "1000423422174",
            appId: "1:1000423422174:web:b5c45a2e9926be0b196a4f"
        };

        // Initialize Firebase at Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Event listener para sa form submission
        const form = document.getElementById('dataForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            const email = document.getElementById('emailInput').value;

            try {
                // Mag-save ng data sa Firestore collection na pinangalanang "users"
                await addDoc(collection(db, "users"), {
                    name: name,
                    email: email,
                    createdAt: new Date()
                });

                statusMsg.textContent = "Tagumpay na na-save sa database!";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
            } catch (error) {
                console.error("Error writing document: ", error);
                statusMsg.textContent = "Nagka-error sa pag-save: " + error.message;
                statusMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
            }
        });
    </script>
</body>
</html>

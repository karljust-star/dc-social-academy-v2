<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DC Social Academy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h1 {
            font-size: 24px;
            color: #111418;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-header p {
            font-size: 11px;
            color: #6b7280;
            letter-spacing: 2px;
            margin-top: 5px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11.5px;
            color: #374151;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #111418;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            background: #fff;
            border-color: #e5be01;
            box-shadow: 0 0 0 3px rgba(229, 190, 1, 0.15);
        }

        .btn-login {
            width: 100%;
            background-color: #e5be01;
            color: #111418;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(229, 190, 1, 0.25);
        }

        .btn-login:hover {
            background-color: #d4ae01;
            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: #6b7280;
        }

        .register-link a {
            color: #111418;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #e5be01;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <h1>DC SOCIAL ACADEMY</h1>
            <p>MEMBER LOGIN PORTAL</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="register.html">Create Account</a>
        </div>
    </div>

</body>
</html>

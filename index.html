<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DC Social Academy</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f8f9fa] flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg border border-[#eef0f2] w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-xl font-extrabold text-[#e5be01]">DC SOCIAL ACADEMY</h2>
            <p class="text-xs text-gray-500 mt-1">Sign in to access your student dashboard</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Email Address or Code</label>
                <input type="text" id="loginEmailOrCode" required placeholder="Enter your email or code" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#e5be01] focus:ring-2 focus:ring-[#e5be01]/20">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#e5be01] focus:ring-2 focus:ring-[#e5be01]/20">
            </div>

            <button type="submit" 
                class="w-full bg-[#e5be01] text-[#111418] py-3 rounded-lg font-extrabold text-sm hover:d4ae01 transition-colors">
                Sign In
            </button>
        </form>

        <div id="loginStatus" class="mt-4 text-center text-xs font-semibold"></div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDMVxPTMiA1VTPnam91L9onX0G3DvBLoik",
            authDomain: "dc-social-academy-v2.firebaseapp.com",
            projectId: "dc-social-academy-v2",
            storageBucket: "dc-social-academy-v2.firebasestorage.app",
            messagingSenderId: "1000423422174",
            appId: "1:1000423422174:web:b5c45a2e9926be0b196a4f"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- LOGIN HANDLER ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const inputVal = document.getElementById('loginEmailOrCode').value.trim();
            const passwordVal = document.getElementById('loginPassword').value;
            const statusDiv = document.getElementById('loginStatus');

            statusDiv.textContent = "Verifying credentials...";
            statusDiv.className = "mt-4 text-center text-xs font-semibold text-gray-600";

            try {
                let userDoc = null;

                // Hanapin muna kung email ang inlagay o code
                if (inputVal.includes('@')) {
                    const querySnapshot = await db.collection('users').where('email', '==', inputVal).get();
                    if (!querySnapshot.empty) {
                        userDoc = querySnapshot.docs[0];
                    }
                } else {
                    const querySnapshot = await db.collection('users').where('code', '==', inputVal).get();
                    if (!querySnapshot.empty) {
                        userDoc = querySnapshot.docs[0];
                    }
                }

                if (!userDoc) {
                    statusDiv.textContent = "Account not found. Please check your email or code.";
                    statusDiv.className = "mt-4 text-center text-xs font-semibold text-red-500";
                    return;
                }

                const userData = userDoc.data();

                // I-check ang password (suportahan ang parehong plain text o kung sakaling may password field)
                const storedPassword = userData.password || userData.pass; 

                if (storedPassword && storedPassword !== passwordVal) {
                    statusDiv.textContent = "Incorrect password. Please try again.";
                    statusDiv.className = "mt-4 text-center text-xs font-semibold text-red-500";
                    return;
                }

                // I-save ang mga detalye sa localStorage para mabasa ng dashboard.html
                localStorage.setItem('dc_user_firstname', userData.firstName || userData.fullName || "Partner");
                localStorage.setItem('dc_user_email', userData.email || "");
                localStorage.setItem('dc_user_birthday', userData.birthday || userData.bday || "");
                localStorage.setItem('dc_user_address', userData.address || "");
                localStorage.setItem('dc_user_code', userData.code || "");

                statusDiv.textContent = "Login successful! Redirecting...";
                statusDiv.className = "mt-4 text-center text-xs font-semibold text-green-600";

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                statusDiv.textContent = "An error occurred. Please try again.";
                statusDiv.className = "mt-4 text-center text-xs font-semibold text-red-500";
            }
        });
    </script>
</body>
</html>
